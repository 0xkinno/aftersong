services:
  - type: web
    name: aftersong-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: QLOO_API_KEY
        sync: false
      - key: BACKEND_SHARED_SECRET
        sync: false
      - key: QLOO_HOST
        value: https://hackathon.api.qloo.com

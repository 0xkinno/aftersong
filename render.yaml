services:
  - type: web
    name: aftersong-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: node src/server.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: QLOO_API_KEY
        sync: false
      - key: QLOO_HOST
        value: https://hackathon.api.qloo.com
      - key: BACKEND_SHARED_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MODEL_PROVIDER
        sync: false
      - key: MODEL_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_ID
        sync: false
      - key: PUBLIC_LOCK
        value: "on"
      - key: PER_VISITOR_PER_DAY
        value: "4"
      - key: PUBLIC_BUILDS_PER_DAY
        value: "60"
      - key: DAILY_QLOO_CAP
        value: "1500"

  # Weekly note to families. Nobody starts it: it runs Monday 07:00 UTC.
  - type: cron
    name: aftersong-weekly-digest
    runtime: node
    rootDir: backend
    schedule: "0 7 * * 1"
    buildCommand: "true"
    startCommand: curl -fsS -X POST -H "x-shared-secret:$BACKEND_SHARED_SECRET" "$BACKEND_URL/internal/digests"
    envVars:
      - key: BACKEND_URL
        sync: false
      - key: BACKEND_SHARED_SECRET
        sync: false

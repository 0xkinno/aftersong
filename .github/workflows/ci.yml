name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19
      - run: npm --prefix backend ci
      - run: npm run typecheck
      - run: npm test
      - name: Offline verifier on synthetic fixtures
        run: npm run verify:fixtures
      - name: Fault switch, model injects an off-card name
        run: node --test --test-name-pattern="fault switch" backend/test/agent.test.ts
      - name: House style, clean check, FACTS matches its source
        run: npm run check
  web:
    name: web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19
      - run: npm --prefix web ci
      - run: npm --prefix web run build

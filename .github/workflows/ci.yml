name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19
      - run: npm --prefix backend ci
      - run: npm run typecheck
      - run: npm test
      - name: Offline verifier on synthetic fixtures
        run: npm run verify:fixtures
      - name: Fault switch, model injects an off-card name
        run: node --test --test-name-pattern="fault switch" backend/test/agent.test.ts
      - name: House style, clean check, FACTS matches its source
        run: npm run check
  web:
    name: web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19
      - run: npm --prefix web ci
      - run: npm --prefix web run build
  quality:
    name: browser quality (5 viewports, axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19
      - run: npm --prefix web ci
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm --prefix web run build
      - name: Start the web app with no backend connected, so unavailable states are checked
        run: |
          (cd web && npx next start -p 3100 &)
          npx --yes wait-on http://localhost:3100 --timeout 60000
      - run: npm --prefix web exec playwright test
        env:
          BASE_URL: http://localhost:3100
